<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Мой день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --mint-1:#CFF3E6;
    --mint-2:#B9E8D8;
    --peach-1:#FFE3C7;
    --peach-2:#FFD2AE;
    --teal:#1F9C82;
    --teal-dark:#157A66;
    --coral:#FF8F65;
    --coral-dark:#E8703F;
    --ink:#1E2B26;
    --ink-soft:#54655F;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.72);
    --glass-border:rgba(255,255,255,0.65);
    --shadow:0 12px 30px rgba(31,64,55,0.12);
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --font-head: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", "Nunito", "Quicksand", -apple-system, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, var(--mint-1) 0%, transparent 55%),
      radial-gradient(circle at 100% 20%, var(--peach-1) 0%, transparent 50%),
      linear-gradient(160deg, var(--mint-2) 0%, #EAF2E8 45%, var(--peach-2) 100%);
    background-attachment:fixed;
    padding:18px 16px 40px;
  }
  .wrap{max-width:480px; margin:0 auto;}

  /* header */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .greeting h1{font-family:var(--font-head); font-size:22px; font-weight:800; margin:0 0 2px; letter-spacing:-0.3px;}
  .greeting p{margin:0; font-size:13.5px; color:var(--ink-soft);}
  .avatar{
    width:60px;height:60px;border-radius:50%;
    background:linear-gradient(135deg,var(--teal),var(--coral));
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); color:#fff;
    overflow:hidden; border:2.5px solid rgba(255,255,255,0.8);
  }
  .avatar img{width:100%;height:100%;object-fit:cover; display:block;}

  .card{
    background:var(--glass);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:18px 18px 20px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
  }
  .card::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(140deg, rgba(255,255,255,0.5), transparent 45%);
    pointer-events:none;
  }

  /* quote */
  .quote-card{
    background:linear-gradient(135deg, rgba(31,156,130,0.16), rgba(255,143,101,0.14)), var(--glass-strong);
  }
  .tag{font-size:11.5px; font-weight:700; color:var(--teal-dark); margin:0 0 8px; display:flex; align-items:center; gap:6px;}
  .quote-text{font-family:var(--font-head); font-size:18px; line-height:1.42; font-weight:700; margin:0; color:var(--ink);}

  .question-card{background:linear-gradient(135deg, rgba(255,143,101,0.18), rgba(255,255,255,0.4)), var(--glass);}
  .question-card .tag{color:var(--coral-dark);}
  .question-text{font-size:15.5px; line-height:1.5; margin:0; font-weight:500;}

  .section-title{
    font-family:var(--font-head);
    font-size:15px; font-weight:800;
    display:flex; align-items:center; gap:8px;
    margin:22px 2px 10px;
    color:var(--ink);
  }
  .section-title .dot{width:8px;height:8px;border-radius:50%;}
  .section-title.morning .dot{background:var(--coral);}
  .section-title.evening .dot{background:#6C7BD6;}

  .stat-line{
    display:flex; gap:14px; font-size:12px; color:var(--ink-soft);
    margin:-2px 2px 10px; font-weight:600;
  }
  .stat-line b{color:var(--teal-dark); font-weight:800;}

  /* checklist */
  .list{display:flex; flex-direction:column; gap:9px;}
  .item{
    display:flex; align-items:center; gap:11px;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-sm);
    padding:11px 13px;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  .item:active{transform:scale(0.98);}
  .check{
    width:22px;height:22px; min-width:22px; border-radius:8px;
    border:2px solid rgba(31,156,130,0.45);
    display:flex;align-items:center;justify-content:center;
    transition:all .2s ease;
    font-size:13px; color:transparent;
  }
  .item.done .check{background:var(--teal); border-color:var(--teal); color:#fff;}
  .item.done span.label{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:rgba(84,101,95,0.5);}
  .label{font-size:14.5px; flex:1;}
  .sub{font-size:12px; color:var(--ink-soft);}
  .item-actions{display:flex; gap:2px; flex:none;}
  .icon-btn{
    width:26px;height:26px; border-radius:8px; border:none; background:transparent;
    display:flex;align-items:center;justify-content:center; font-size:14px;
    color:var(--ink-soft); cursor:pointer;
  }
  .icon-btn:active{background:rgba(84,101,95,0.12);}
  .icon-btn.del:active{background:rgba(232,112,63,0.18); color:var(--coral-dark);}
  .count-badge{
    font-size:11px; font-weight:800; color:var(--teal-dark);
    background:rgba(31,156,130,0.14); border-radius:99px;
    padding:3px 8px; flex:none; white-space:nowrap;
  }
  .sport-today-tag{
    background:rgba(255,143,101,0.14); border-radius:14px;
    padding:9px 14px; font-size:13px; color:var(--ink);
    margin:-2px 0 2px;
  }
  .sport-today-tag b{color:var(--coral-dark); font-weight:800;}
  .inline-edit-input{
    flex:1; font-size:14.5px; font-family:var(--font-body); color:var(--ink);
    border:none; border-bottom:2px solid var(--teal); background:transparent;
    outline:none; padding:0 0 2px;
  }

  /* medications */
  .med-item .check{border-radius:50%;}

  /* water */
  .water-card{display:flex; align-items:center; gap:18px;}
  .water-ring{position:relative; width:92px; height:92px; flex:none;}
  .water-ring svg{transform:rotate(-90deg);}
  .water-ring .center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .water-ring .amt{font-family:var(--font-head); font-weight:800; font-size:16px;}
  .water-ring .goal{font-size:10.5px; color:var(--ink-soft);}
  .water-info{flex:1;}
  .water-info p{margin:0 0 10px; font-size:13.5px; color:var(--ink-soft);}
  .water-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; border:none; border-radius:16px;
    padding:13px 16px; font-size:15px; font-weight:700;
    font-family:var(--font-body);
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    color:#fff; box-shadow:0 10px 22px rgba(31,156,130,0.35);
    cursor:pointer; transition:transform .12s ease;
  }
  .water-btn:active{transform:scale(0.97);}

  /* plan progress */
  .progress-bar{height:8px; border-radius:99px; background:rgba(31,64,55,0.1); overflow:hidden; margin:2px 0 14px;}
  .progress-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--teal),var(--coral)); transition:width .3s ease;}

  /* evening free text lists */
  .free-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .free-item{
    background:var(--glass-strong); border:1px solid var(--glass-border);
    border-radius:var(--radius-sm); padding:10px 13px; font-size:14px; line-height:1.4;
    display:flex; gap:8px; align-items:flex-start;
  }
  .free-item .bullet{color:var(--coral); font-weight:800; margin-top:1px;}
  .add-row{display:flex; gap:8px;}
  .add-row input{
    flex:1; border:1px solid rgba(84,101,95,0.25); background:rgba(255,255,255,0.55);
    border-radius:var(--radius-sm); padding:11px 13px; font-size:14px; font-family:var(--font-body);
    outline:none; color:var(--ink);
  }
  .add-row input::placeholder{color:rgba(84,101,95,0.6);}
  .add-row button{
    border:none; border-radius:var(--radius-sm); padding:0 16px;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    color:#fff; font-size:19px; font-weight:700;
    cursor:pointer; min-width:44px;
    box-shadow:0 6px 16px rgba(31,156,130,0.3);
  }

  .night-q{margin-top:16px; background:linear-gradient(135deg, rgba(108,123,214,0.16), rgba(255,255,255,0.4)), var(--glass);}
  .night-q .tag{color:#5561B8;}

  .fallback{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:14px;
  }
  .fallback .big{font-size:32px; margin-bottom:8px;}

  ::selection{background:rgba(31,156,130,0.25);}

  /* finance */
  .finance-row{display:flex; gap:10px;}
  .finance-field{flex:1;}
  .finance-field label{font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px; font-weight:600;}
  .finance-input{
    width:100%; border:1px solid rgba(84,101,95,0.25); background:rgba(255,255,255,0.6);
    border-radius:12px; padding:10px 12px; font-size:15px; font-family:var(--font-body);
    color:var(--ink); outline:none;
  }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,30,26,0.45);
    display:none; align-items:center; justify-content:center;
    z-index:1000; padding:20px; backdrop-filter:blur(2px);
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    background:#fff; border-radius:26px; padding:22px 20px 24px;
    max-width:400px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.25);
    max-height:85vh; overflow-y:auto;
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .modal-title{font-family:var(--font-head); font-size:19px; font-weight:800; color:var(--ink);}
  .modal-close{
    width:34px;height:34px; border-radius:12px; border:none;
    background:rgba(84,101,95,0.1); font-size:15px; cursor:pointer; color:var(--ink-soft);
    flex:none;
  }
  .modal-sub{font-size:13px; color:var(--ink-soft); margin:0 0 16px;}
  .sport-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .sport-opt{
    border:1.5px solid rgba(84,101,95,0.18); border-radius:16px; padding:16px 14px;
    font-weight:700; font-size:15px; color:var(--ink); cursor:pointer;
    background:#FAFCFB; transition:all .15s ease; text-align:center;
  }
  .sport-opt.selected{border-color:var(--teal); background:rgba(31,156,130,0.12); color:var(--teal-dark);}
  .modal-save-btn{
    width:100%; border:none; border-radius:16px; padding:14px;
    font-size:15px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    cursor:pointer; box-shadow:0 10px 22px rgba(31,156,130,0.3);
  }
  .stat-tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .stat-tile{background:#F3F7F5; border-radius:16px; padding:16px 10px; text-align:center;}
  .stat-tile .num{font-family:var(--font-head); font-weight:800; font-size:24px; color:var(--ink);}
  .stat-tile .cap{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .breakdown-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 2px; border-top:1px solid rgba(84,101,95,0.12); font-size:14px;
  }
  .breakdown-row:first-of-type{border-top:none; margin-top:8px;}
  .breakdown-row .bnum{font-weight:700; color:var(--ink-soft); font-size:12.5px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="topbar">
    <div class="greeting">
      <h1 id="greetingText">Доброе утро</h1>
      <p id="dateText"></p>
    </div>
    <div class="avatar"><img src="assets/avatar.jpg" alt="Валентина"></div>
  </div>

  <div id="content">
    <div class="fallback">
      <div class="big">⏳</div>
      Загружаю день...
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard"></div>
</div>

<script>
(function(){
  try{
    if(window.Telegram && window.Telegram.WebApp){
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  }catch(e){}

  var dateEl = document.getElementById('dateText');
  var greetingEl = document.getElementById('greetingText');
  var SPORT_TYPES = [];
  var now = new Date();
  var hours = now.getHours();
  greetingEl.textContent = hours < 5 ? 'Доброй ночи' : hours < 12 ? 'Доброе утро' : hours < 18 ? 'Добрый день' : 'Добрый вечер';
  var days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  var months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  dateEl.textContent = now.getDate()+' '+months[now.getMonth()]+', '+days[now.getDay()];

  function dayIndex(len){
    var start = new Date(now.getFullYear(),0,0);
    var diff = now - start;
    var oneDay = 1000*60*60*24;
    var doy = Math.floor(diff/oneDay);
    return doy % len;
  }

  function loadState(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      if(!raw) return fallback;
      var parsed = JSON.parse(raw);
      if(parsed.date !== todayKey()) return fallback;
      return parsed.value;
    }catch(e){ return fallback; }
  }
  function saveState(key, value){
    try{
      localStorage.setItem(key, JSON.stringify({date: todayKey(), value: value}));
    }catch(e){}
  }
  function todayKey(){
    return now.getFullYear()+'-'+now.getMonth()+'-'+now.getDate();
  }

  function render(data){
    var content = document.getElementById('content');

    var quote = data.quotes[dayIndex(data.quotes.length)];
    var dayQ = data.dayQuestions[dayIndex(data.dayQuestions.length)];
    var nightQ = data.nightQuestions[dayIndex(data.nightQuestions.length)];

    var rituals = loadState('rituals', data.morning.rituals);
    var meds = loadState('meds', data.morning.medications);
    var plan = loadState('plan', data.dayPlan);
    var habits = loadState('habits', data.habits || []);
    var water = loadState('water', data.water);
    var goodThings = loadState('goodThings', data.evening.goodThings);
    var gratitude = loadState('gratitude', data.evening.gratitude);
    var earned = loadState('earned', 0);
    var spent = loadState('spent', 0);
    SPORT_TYPES = data.sportTypes || [];

    initItemHistorySeed(data.historySeed || []);
    recordItemHistory(rituals);
    recordItemHistory(meds, 'taken');
    recordItemHistory(habits);

    content.innerHTML =
      '<div class="card quote-card">'+
        '<p class="tag">✨ Мысль дня</p>'+
        '<p class="quote-text">'+escapeHtml(quote)+'</p>'+
      '</div>'+

      '<div class="card question-card">'+
        '<p class="tag">💭 Вопрос дня</p>'+
        '<p class="question-text">'+escapeHtml(dayQ)+'</p>'+
      '</div>'+

      '<div class="section-title morning"><span class="dot"></span>Утренние ритуалы</div>'+
      '<div class="card">'+
        '<div class="progress-bar" style="margin-bottom:12px;"><div class="progress-fill" id="ritualsFill"></div></div>'+
        '<div class="list" id="ritualsList"></div>'+
        '<div class="add-row" style="margin-top:10px;"><input id="ritualInput" placeholder="Новый ритуал..." maxlength="60"><button id="ritualAdd">+</button></div>'+
      '</div>'+

      '<div class="section-title morning"><span class="dot"></span>Лекарства</div>'+
      '<div class="card">'+
        '<div class="progress-bar" style="margin-bottom:12px;"><div class="progress-fill" id="medsFill"></div></div>'+
        '<div class="list" id="medsList"></div>'+
        '<div class="add-row" style="margin-top:10px;"><input id="medInput" placeholder="Название, доза (напр. Магний, 2 табл.)" maxlength="80"><button id="medAdd">+</button></div>'+
      '</div>'+
      '<div class="card water-card">'+
        '<div class="water-ring">'+
          '<svg width="92" height="92" viewBox="0 0 92 92">'+
            '<circle cx="46" cy="46" r="38" fill="none" stroke="rgba(31,64,55,0.12)" stroke-width="9"/>'+
            '<circle id="waterArc" cx="46" cy="46" r="38" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"/>'+
            '<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">'+
              '<stop offset="0%" stop-color="#1F9C82"/><stop offset="100%" stop-color="#FF8F65"/>'+
            '</linearGradient></defs>'+
          '</svg>'+
          '<div class="center"><div class="amt" id="waterAmt"></div><div class="goal" id="waterGoal"></div></div>'+
        '</div>'+
        '<div class="water-info">'+
          '<p>Отмечай каждый стакан — тело скажет спасибо</p>'+
          '<button class="water-btn" id="waterBtn">💧 +250 мл</button>'+
        '</div>'+
      '</div>'+

      '<div class="section-title"><span class="dot" style="background:var(--teal)"></span>План на день</div>'+
      '<div class="card">'+
        '<div class="list" id="planList"></div>'+
        '<div class="add-row" style="margin-top:10px;"><input id="planInput" placeholder="Новая задача..." maxlength="90"><button id="planAdd">+</button></div>'+
      '</div>'+

      '<div class="section-title"><span class="dot" style="background:#6C7BD6"></span>Привычки</div>'+
      '<div class="card">'+
        '<div class="list" id="habitsList"></div>'+
        '<div class="add-row" style="margin-top:10px;"><input id="habitInput" placeholder="Новая привычка..." maxlength="60"><button id="habitAdd">+</button></div>'+
      '</div>'+

      '<div class="section-title evening"><span class="dot"></span>Вечер</div>'+
      '<div class="card">'+
        '<p class="tag" style="color:#5561B8">🌤️ Что хорошего было сегодня</p>'+
        '<div class="free-list" id="goodList"></div>'+
        '<div class="add-row"><input id="goodInput" placeholder="Добавить событие..." maxlength="140"><button id="goodAdd">+</button></div>'+
      '</div>'+
      '<div class="card">'+
        '<p class="tag" style="color:#5561B8">🙏 За что я благодарна</p>'+
        '<div class="free-list" id="gratList"></div>'+
        '<div class="add-row"><input id="gratInput" placeholder="Добавить..." maxlength="140"><button id="gratAdd">+</button></div>'+
      '</div>'+
      '<div class="card">'+
        '<p class="tag" style="color:#5561B8">💰 Финансы дня</p>'+
        '<div class="finance-row">'+
          '<div class="finance-field"><label>Заработано</label><input type="number" inputmode="decimal" id="earnedInput" class="finance-input" placeholder="0"></div>'+
          '<div class="finance-field"><label>Потрачено</label><input type="number" inputmode="decimal" id="spentInput" class="finance-input" placeholder="0"></div>'+
        '</div>'+
      '</div>'+
      '<div class="card night-q">'+
        '<p class="tag">🌙 Вопрос на ночь</p>'+
        '<p class="question-text">'+escapeHtml(nightQ)+'</p>'+
      '</div>';

    // rituals
    function openSportModal(){
      var key = todayKey();
      var s = readItemStats();
      var todayEntry = s[key] || {};
      var selection = {};
      SPORT_TYPES.forEach(function(t){ selection[t.id] = !!todayEntry[t.id]; });

      var html = '<div class="modal-head"><div class="modal-title">Движение / спорт</div><button class="modal-close">✕</button></div>'+
        '<div class="modal-sub">Можно выбрать несколько вариантов за день.</div>'+
        '<div class="sport-grid">' + SPORT_TYPES.map(function(t){
          return '<div class="sport-opt'+(selection[t.id]?' selected':'')+'" data-id="'+t.id+'">'+escapeHtml(t.label)+'</div>';
        }).join('') + '</div>'+
        '<button class="modal-save-btn" id="sportSaveBtn">Сохранить</button>';

      openModal(html);
      var overlay = document.getElementById('modalOverlay');
      overlay.querySelectorAll('.sport-opt').forEach(function(el){
        el.addEventListener('click', function(){
          var id = el.getAttribute('data-id');
          selection[id] = !selection[id];
          el.classList.toggle('selected', selection[id]);
        });
      });
      overlay.querySelector('.modal-close').addEventListener('click', closeModal);
      overlay.querySelector('#sportSaveBtn').addEventListener('click', function(){
        var s2 = readItemStats();
        if(!s2[key]) s2[key] = {};
        var any=false;
        SPORT_TYPES.forEach(function(t){ s2[key][t.id] = !!selection[t.id]; if(selection[t.id]) any=true; });
        writeItemStats(s2);
        var sportItem = rituals.filter(function(r){ return r.isSport; })[0];
        if(sportItem){ sportItem.done = any; }
        onRitualsChange(rituals);
        closeModal();
      });
    }
    function onRitualsChange(next){
      rituals=next; saveState('rituals',rituals);
      updateProgress('ritualsFill', rituals);
      recordItemHistory(rituals);
      renderChecklist('ritualsList', rituals, onRitualsChange, openSportModal);
    }
    renderChecklist('ritualsList', rituals, onRitualsChange, openSportModal);
    document.getElementById('ritualAdd').addEventListener('click', function(){
      addChecklistItem('ritualInput', rituals, onRitualsChange);
    });

    // meds
    function onMedsChange(next){
      meds=next; saveState('meds',meds);
      updateProgress('medsFill', meds, 'taken');
      recordItemHistory(meds, 'taken');
      renderMeds(meds, onMedsChange);
    }
    renderMeds(meds, onMedsChange);
    document.getElementById('medAdd').addEventListener('click', function(){
      var input = document.getElementById('medInput');
      var val = input.value.trim();
      if(!val) return;
      var parts = val.split(',');
      var name = parts[0].trim();
      var dose = parts.length>1 ? parts.slice(1).join(',').trim() : '';
      meds.push({id:'m_'+Date.now(), name:name, dose:dose, taken:false});
      onMedsChange(meds);
      input.value='';
    });

    // habits (без общей шкалы — только счётчик у каждого пункта)
    function onHabitsChange(next){
      habits=next; saveState('habits',habits);
      recordItemHistory(habits);
      renderChecklist('habitsList', habits, onHabitsChange);
    }
    renderChecklist('habitsList', habits, onHabitsChange);
    document.getElementById('habitAdd').addEventListener('click', function(){
      addChecklistItem('habitInput', habits, onHabitsChange);
    });

    // plan (без прогресса и без счётчиков — задачи не повторяются день в день)
    function onPlanChange(next){
      plan=next; saveState('plan',plan);
      renderPlan(plan, onPlanChange);
    }
    renderPlan(plan, onPlanChange);
    document.getElementById('planAdd').addEventListener('click', function(){
      var input = document.getElementById('planInput');
      var val = input.value.trim();
      if(!val) return;
      plan.push({id:'p_'+Date.now(), text:val, done:false});
      onPlanChange(plan);
      input.value='';
    });

    updateProgress('ritualsFill', rituals);
    updateProgress('medsFill', meds, 'taken');

    // water
    updateWater(water);
    document.getElementById('waterBtn').addEventListener('click', function(){
      water = {current: Math.min(water.current + water.step, water.goal*2), goal: water.goal, step: water.step};
      saveState('water', water);
      updateWater(water);
      try{ if(window.Telegram && Telegram.WebApp.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light'); }catch(e){}
    });
    // good things / gratitude
    renderFreeList('goodList', goodThings);
    renderFreeList('gratList', gratitude);
    document.getElementById('goodAdd').addEventListener('click', function(){
      addFreeItem('goodInput','goodList', goodThings, function(next){ goodThings=next; saveState('goodThings',goodThings); });
    });
    document.getElementById('gratAdd').addEventListener('click', function(){
      addFreeItem('gratInput','gratList', gratitude, function(next){ gratitude=next; saveState('gratitude',gratitude); });
    });
    bindEnter('goodInput','goodAdd');
    bindEnter('gratInput','gratAdd');
    bindEnter('ritualInput','ritualAdd');
    bindEnter('medInput','medAdd');
    bindEnter('habitInput','habitAdd');
    bindEnter('planInput','planAdd');

    document.getElementById('earnedInput').value = earned || '';
    document.getElementById('spentInput').value = spent || '';
    document.getElementById('earnedInput').addEventListener('input', function(e){
      earned = parseFloat(e.target.value) || 0; saveState('earned', earned);
    });
    document.getElementById('spentInput').addEventListener('input', function(e){
      spent = parseFloat(e.target.value) || 0; saveState('spent', spent);
    });

    function updateWater(w){
      var pct = Math.min(w.current / w.goal, 1);
      var circumference = 2*Math.PI*38;
      var arc = document.getElementById('waterArc');
      arc.setAttribute('stroke-dasharray', circumference);
      arc.setAttribute('stroke-dashoffset', circumference*(1-pct));
      document.getElementById('waterAmt').textContent = w.current+' мл';
      document.getElementById('waterGoal').textContent = 'из '+w.goal;
    }
  }

  function startInlineEdit(row, currentValue, onCommit){
    var labelEl = row.querySelector('.label');
    if(!labelEl) return;
    var input = document.createElement('input');
    input.type='text';
    input.value=currentValue;
    input.className='inline-edit-input';
    input.maxLength=90;
    labelEl.replaceWith(input);
    input.focus();
    input.select();
    var done=false;
    function commit(save){
      if(done) return;
      done=true;
      var val = input.value.trim();
      onCommit(save && val ? val : currentValue);
    }
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); commit(true); }
      if(e.key==='Escape'){ e.preventDefault(); commit(false); }
    });
    input.addEventListener('blur', function(){ commit(true); });
  }

  function renderChecklist(containerId, items, onChange, onSportClick){
    var el = document.getElementById(containerId);
    el.innerHTML='';
    items.forEach(function(it){
      var row=document.createElement('div');
      row.className='item'+(it.done?' done':'');
      var count = getItemCount(it.id, 7);
      row.innerHTML='<div class="check">✓</div><span class="label">'+escapeHtml(it.title)+'</span>'+
        '<button type="button" class="count-badge">'+count+'/7</button>'+
        '<div class="item-actions">'+
          '<button class="icon-btn edit">✎</button>'+
          '<button class="icon-btn del">✕</button>'+
        '</div>';
      row.addEventListener('click', function(e){
        if(e.target.closest('.item-actions') || e.target.closest('.count-badge') || e.target.classList.contains('inline-edit-input')) return;
        if(it.isSport && onSportClick){ onSportClick(); return; }
        it.done=!it.done;
        onChange(items);
      });
      row.querySelector('.count-badge').addEventListener('click', function(e){
        e.stopPropagation();
        showStatsModal(it.title, it.id, it.isSport ? SPORT_TYPES : null);
      });
      row.querySelector('.edit').addEventListener('click', function(e){
        e.stopPropagation();
        startInlineEdit(row, it.title, function(newVal){
          it.title = newVal;
          onChange(items);
        });
      });
      row.querySelector('.del').addEventListener('click', function(e){
        e.stopPropagation();
        var idx = items.indexOf(it);
        if(idx>-1){ items.splice(idx,1); onChange(items); }
      });
      el.appendChild(row);

      if(it.isSport){
        var labels = getTodaySportLabels();
        if(labels.length){
          var tag = document.createElement('div');
          tag.className = 'sport-today-tag';
          tag.innerHTML = '<b>Сегодня:</b> ' + labels.map(escapeHtml).join(' · ');
          el.appendChild(tag);
        }
      }
    });
  }

  function addChecklistItem(inputId, items, onChange){
    var input = document.getElementById(inputId);
    var val = input.value.trim();
    if(!val) return;
    items.push({id:'i_'+Date.now(), title: val, done:false});
    onChange(items);
    input.value='';
  }

  function renderMeds(items, onChange){
    var el = document.getElementById('medsList');
    el.innerHTML='';
    items.forEach(function(it){
      var row=document.createElement('div');
      var count = getItemCount(it.id, 7);
      row.className='item med-item'+(it.taken?' done':'');
      row.innerHTML='<div class="check">✓</div><div style="flex:1"><div class="label">'+escapeHtml(it.name)+'</div>'+(it.dose?'<div class="sub">'+escapeHtml(it.dose)+'</div>':'')+'</div>'+
        '<button type="button" class="count-badge">'+count+'/7</button>'+
        '<div class="item-actions">'+
          '<button class="icon-btn edit">✎</button>'+
          '<button class="icon-btn del">✕</button>'+
        '</div>';
      row.addEventListener('click', function(e){
        if(e.target.closest('.item-actions') || e.target.closest('.count-badge')) return;
        it.taken=!it.taken;
        onChange(items);
      });
      row.querySelector('.count-badge').addEventListener('click', function(e){
        e.stopPropagation();
        showStatsModal(it.name, it.id, null);
      });
      row.querySelector('.edit').addEventListener('click', function(e){
        e.stopPropagation();
        var labelDiv = row.querySelector('.label');
        var input = document.createElement('input');
        input.type='text'; input.className='inline-edit-input';
        input.value = it.name + (it.dose ? (', '+it.dose) : '');
        labelDiv.parentElement.replaceWith(input);
        input.focus(); input.select();
        var done=false;
        function commit(save){
          if(done) return; done=true;
          if(save && input.value.trim()){
            var parts = input.value.split(',');
            it.name = parts[0].trim();
            it.dose = parts.length>1 ? parts.slice(1).join(',').trim() : '';
          }
          onChange(items);
        }
        input.addEventListener('keydown', function(e){
          if(e.key==='Enter'){ e.preventDefault(); commit(true); }
          if(e.key==='Escape'){ e.preventDefault(); commit(false); }
        });
        input.addEventListener('blur', function(){ commit(true); });
      });
      row.querySelector('.del').addEventListener('click', function(e){
        e.stopPropagation();
        var idx = items.indexOf(it);
        if(idx>-1){ items.splice(idx,1); onChange(items); }
      });
      el.appendChild(row);
    });
  }

  function renderPlan(items, onChange){
    var el = document.getElementById('planList');
    el.innerHTML='';
    items.forEach(function(it){
      var row=document.createElement('div');
      row.className='item'+(it.done?' done':'');
      row.innerHTML='<div class="check">✓</div><span class="label">'+escapeHtml(it.text)+'</span>'+
        '<div class="item-actions">'+
          '<button class="icon-btn edit">✎</button>'+
          '<button class="icon-btn del">✕</button>'+
        '</div>';
      row.addEventListener('click', function(e){
        if(e.target.closest('.item-actions') || e.target.classList.contains('inline-edit-input')) return;
        it.done=!it.done;
        onChange(items);
      });
      row.querySelector('.edit').addEventListener('click', function(e){
        e.stopPropagation();
        startInlineEdit(row, it.text, function(newVal){
          it.text = newVal;
          onChange(items);
        });
      });
      row.querySelector('.del').addEventListener('click', function(e){
        e.stopPropagation();
        var idx = items.indexOf(it);
        if(idx>-1){ items.splice(idx,1); onChange(items); }
      });
      el.appendChild(row);
    });
  }

  function updateProgress(fillId, items, doneKey){
    doneKey = doneKey || 'done';
    var done = items.filter(function(i){return i[doneKey];}).length;
    var pct = items.length ? Math.round(done/items.length*100) : 0;
    var fill = document.getElementById(fillId);
    if(fill) fill.style.width = pct+'%';
  }

  /* ---- history & stats ---- */
  function offsetDateKey(offsetDays){
    var d = new Date(now);
    d.setDate(d.getDate()+offsetDays);
    return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
  }

  function readItemStats(){
    try{ return JSON.parse(localStorage.getItem('itemStats')||'{}'); }catch(e){ return {}; }
  }
  function writeItemStats(s){
    try{ localStorage.setItem('itemStats', JSON.stringify(s)); }catch(e){}
  }
  function initItemHistorySeed(seed){
    var s = readItemStats();
    if(Object.keys(s).length) return;
    seed.forEach(function(entry){
      if(!entry.items) return;
      var key = offsetDateKey(entry.offset);
      s[key] = entry.items;
    });
    writeItemStats(s);
  }
  function recordItemHistory(items, doneKey){
    doneKey = doneKey || 'done';
    var s = readItemStats();
    var key = todayKey();
    if(!s[key]) s[key] = {};
    items.forEach(function(it){ s[key][it.id] = !!it[doneKey]; });
    writeItemStats(s);
  }
  function getItemWeeklyCount(id){
    return getItemCount(id, 7);
  }
  function getItemCount(id, days){
    var s = readItemStats();
    var count=0;
    for(var i=0;i<days;i++){
      var key = offsetDateKey(-i);
      if(s[key] && s[key][id]===true) count++;
    }
    return count;
  }
  function getTodaySportLabels(){
    var s = readItemStats();
    var today = s[todayKey()] || {};
    return SPORT_TYPES.filter(function(t){ return !!today[t.id]; }).map(function(t){ return t.label; });
  }

  /* ---- modal ---- */
  function openModal(html){
    var card = document.getElementById('modalCard');
    var overlay = document.getElementById('modalOverlay');
    card.innerHTML = html;
    overlay.classList.add('open');
  }
  function closeModal(){
    document.getElementById('modalOverlay').classList.remove('open');
  }
  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if(e.target.id === 'modalOverlay') closeModal();
  });

  function showStatsModal(title, id, breakdown){
    var w = getItemCount(id,7), m = getItemCount(id,30);
    var html = '<div class="modal-head"><div class="modal-title">'+escapeHtml(title)+'</div><button class="modal-close">✕</button></div>'+
      '<div class="stat-tiles">'+
        '<div class="stat-tile"><div class="num">'+w+'/7</div><div class="cap">за 7 дней</div></div>'+
        '<div class="stat-tile"><div class="num">'+m+'/30</div><div class="cap">за 30 дней</div></div>'+
      '</div>';
    if(breakdown && breakdown.length){
      html += '<div>' + breakdown.map(function(b){
        var bw=getItemCount(b.id,7), bm=getItemCount(b.id,30);
        return '<div class="breakdown-row"><span>'+escapeHtml(b.label)+'</span><span class="bnum">'+bw+'/7 · '+bm+'/30</span></div>';
      }).join('') + '</div>';
    }
    openModal(html);
    document.getElementById('modalCard').querySelector('.modal-close').addEventListener('click', closeModal);
  }

  function renderFreeList(containerId, items){
    var el = document.getElementById(containerId);
    el.innerHTML='';
    items.forEach(function(text){
      var row=document.createElement('div');
      row.className='free-item';
      row.innerHTML='<span class="bullet">•</span><span>'+escapeHtml(text)+'</span>';
      el.appendChild(row);
    });
  }

  function bindEnter(inputId, buttonId){
    var input = document.getElementById(inputId);
    if(!input) return;
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); document.getElementById(buttonId).click(); }
    });
  }

  function addFreeItem(inputId, listId, items, onChange){
    var input = document.getElementById(inputId);
    var val = input.value.trim();
    if(!val) return;
    items.push(val);
    onChange(items);
    renderFreeList(listId, items);
    input.value='';
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderFallback(){
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="fallback">'+
      '<div class="big">🌤️</div>'+
      'Не получилось загрузить данные дня.<br>Проверь соединение и открой приложение заново.'+
      '</div></div>';
  }

  fetch('data.json?v='+Date.now())
    .then(function(r){ if(!r.ok) throw new Error('bad response'); return r.json(); })
    .then(render)
    .catch(renderFallback);
})();
</script>
</body>
</html>
